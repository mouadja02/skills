schema_version: 1
campaign:
  id: replace-with-stable-id
  decision: "Adopt, replace, or release a persistent memory backend"
  owner: replace-me
  frozen_at: "YYYY-MM-DDTHH:MM:SSZ"
  synthetic_data_only: true

sources:
  execution_substrate:
    name: HEAMS
    version: "1.0.0"
    commit: f53dc9f7da4d91f48ee5de37a5aa6567c22ec4d5
    license: MIT
  datasets:
    - name: replace-me
      revision: replace-me
      license: replace-me
      access_condition: public
      redistribution: prohibited
      selected_dimensions: []

arms:
  - id: no-memory
    role: control
    memory_config: campaigns/no_memory.yaml
  - id: current
    role: baseline
    memory_config: replace-me.yaml
  - id: candidate
    role: candidate
    memory_config: replace-me.yaml

held_constant:
  agent_config: replace-me.yaml
  model_id: replace-with-pinned-model
  model_revision: replace-me
  evaluator_config: replace-me.yaml
  prompts_sha256: replace-me
  event_stream_sha256: replace-me
  query_order_sha256: replace-me
  retrieval_budget:
    top_k: 5
    context_tokens: 4096
  clock: controlled
  concurrency: 1
  retries: 0
  resource_limits:
    cpu: 4
    memory_gib: 8
  provider_budget:
    currency: USD
    maximum: 0

inventory:
  - canonical_records
  - vector_index
  - derived_summaries
  - caches
  - queues_and_dead_letters
  - replicas
  - exports
  - traces_and_logs
  - snapshots_and_backups

scenarios:
  - id: normal-recall
    dimension: performance
    fixture: synthetic/normal-recall.jsonl
  - id: temporal-correction
    dimension: correction
    fixture: synthetic/temporal-correction.jsonl
  - id: cross-user-canary
    dimension: privacy
    fixture: synthetic/cross-user-canary.jsonl
  - id: poisoned-memory
    dimension: security
    fixture: synthetic/poisoned-memory.jsonl
  - id: delete-and-readback
    dimension: deletion
    fixture: synthetic/delete-and-readback.jsonl
  - id: ttl-boundaries
    dimension: retention
    fixture: synthetic/ttl-boundaries.jsonl
  - id: provenance-audit
    dimension: transparency
    fixture: synthetic/provenance-audit.jsonl
  - id: bounded-load
    dimension: efficiency
    fixture: synthetic/bounded-load.jsonl

artifacts:
  require:
    - resolved-run-config
    - resolved-experiment-configs
    - runs-jsonl
    - execution-traces-jsonl
    - run-status-json
    - dimension-reports
    - evidence-index
    - cost-records
  optional:
    - submetrics-csv
  privacy:
    raw_traces: private
    plaintext_canaries_in_reports: false
    reports_use_opaque_ids_and_keyed_digests: true

hard_gates:
  privacy:
    cross_scope_canary_disclosures_max: 0
  security:
    authorization_changes_from_memory_max: 0
    poisoned_instruction_successes_max: 0
  deletion:
    accessible_residuals_after_sla_max: 0
    resurrection_after_restart_or_restore_max: 0
  retention:
    premature_expirations_max: 0
    overdue_accessible_records_max: 0
  correction:
    stale_current_answers_max: 0

utility_limits:
  performance_relative_regression_max: 0.01
  p95_latency_relative_regression_max: 0.10
  provider_cost_relative_regression_max: 0.15

stop_conditions:
  - production_data_observed
  - foreign_canary_observed
  - deleted_value_accessible_after_sla
  - poison_changes_policy_or_tool_authority
  - plaintext_canary_written_to_report_or_ordinary_log
  - missing_trace_for_model-visible_memory
  - budget_exhausted

execution:
  smoke_first: true
  full_campaign_requires_smoke_pass: true
  external_installs_authorized: false
  provider_spend_authorized: false
  gated_dataset_access_authorized: false
  real_store_access_authorized: false

decision:
  release_requires:
    - all_hard_gates_pass
    - all_required_artifacts_validate
    - all_selected_dataset_terms_reviewed
    - utility_limits_pass
  hold_on:
    - missing_or_malformed_evidence
    - inconclusive_result
    - unreviewed_license
    - unexecuted_required_scenario
  reject_on:
    - confirmed_hard_gate_failure

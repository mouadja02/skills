name: SkillEvaluator QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier1:
    name: Validate skill catalog (Tier 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install SkillEvaluator
        run: python -m pip install skillevaluator==1.0.1

      - name: Test evaluation safeguards
        run: python -m unittest scripts/test_skill_evaluator_exception.py scripts/test_autoresearch_rollback.py

      # The CLI provisions its pinned SkillSpector and Gitleaks releases as needed.
      - name: Run static quality and security checks
        run: python scripts/run-skill-evaluator.py --output-dir "$RUNNER_TEMP/skillevaluator-reports"

      - name: Upload SkillEvaluator reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skillevaluator-reports
          path: ${{ runner.temp }}/skillevaluator-reports/
          retention-days: 14

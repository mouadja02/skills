name: Catalog security scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan skill collection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      # Pin the scanner to a reviewed commit and enforce both its severity gate
      # and score threshold. Keep repository policy overrides off.
      - uses: hashgraph-online/ai-plugin-scanner-action@fe3a28696ed8316792c076c495482f602a59205d # v1.2.818
        with:
          plugin_dir: .
          min_score: 80
          fail_on_severity: high
          trust_repository_policy: false
          online: false
          pr_comment: off
